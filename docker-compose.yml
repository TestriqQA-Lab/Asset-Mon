services:
  # The service keeps the name `mysql` because DATABASE_URL addresses it by that
  # hostname, but it runs MariaDB — the same server production runs.
  #
  # It used to be mysql:8.4, and that stopped working when the API moved to Prisma 7.
  # Prisma 7 has no query engine and talks to the database through the pure-JS mariadb
  # driver, whose POOLED path cannot complete MySQL 8.4's caching_sha2_password
  # handshake: every query fails with ER_GET_CONNECTION_TIMEOUT having opened no
  # connection at all. A single connection succeeds, which makes it look like a
  # networking problem rather than an authentication one. Matching production removes
  # the question entirely.
  mysql:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      # Tables are created with utf8mb4_bin (case-sensitive); a handful of
      # searchable columns are then relaxed to utf8mb4_general_ci by
      # packages/db/post-migrate-collations.sql. Pinning the server default keeps a
      # fresh container consistent with what `prisma migrate deploy` expects.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
    environment:
      # The variable names in .env stay MYSQL_* — run-local.sh and verify-deploy.sh
      # both write them — and are handed to MariaDB under the names it documents.
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-assetmon}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      # Shipped by the mariadb image; --innodb_initialized is what distinguishes
      # "accepting connections" from "actually ready to serve".
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Legacy source database — kept only to migrate data OUT of, not to serve the app.
  # Not started by default; bring it up explicitly while running the consolidation:
  #   docker compose --profile legacy up -d postgres
  # Retire it (and the pgdata volume) once cutover is signed off.
  postgres:
    image: postgres:16
    profiles: ["legacy"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legacy_migration_only}
      POSTGRES_DB: assetmon_catalog
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  mysqldata:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
