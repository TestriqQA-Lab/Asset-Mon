services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      # Tables are created with utf8mb4_0900_as_cs (case-sensitive); a handful of
      # searchable columns are then relaxed to utf8mb4_general_ci by
      # packages/db/post-migrate-collations.sql. Pinning the server default keeps a
      # fresh container consistent with what `prisma migrate deploy` expects.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_cs
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-assetmon}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Legacy source database — kept only to migrate data OUT of, not to serve the app.
  # Not started by default; bring it up explicitly while running the consolidation:
  #   docker compose --profile legacy up -d postgres
  # Retire it (and the pgdata volume) once cutover is signed off.
  postgres:
    image: postgres:16
    profiles: ["legacy"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legacy_migration_only}
      POSTGRES_DB: assetmon_catalog
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  mysqldata:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
