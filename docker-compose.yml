services:
  # Named `db`, not `mysql`. The old name came from DATABASE_URL addressing the service
  # by that hostname, and it already outlived the truth once — it stayed `mysql` after
  # the image became MariaDB. Carrying it over to a Postgres container as well would
  # have been one confusion too many, so the rename happened with the engine change
  # rather than being left for later.
  #
  # No charset or collation flags, unlike the MariaDB version of this file. The image
  # initialises UTF-8, and Postgres compares case-sensitively by default. That default
  # is load-bearing now: searches opt into case-insensitivity per query with Prisma's
  # `mode: 'insensitive'`, instead of a dozen columns being collated for it the way
  # MySQL forced.
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-assetmon}
    volumes:
      # dbdata, NOT pgdata. The compose project is named after this directory, so a
      # volume called `pgdata` resolves to `assetmon-source_pgdata` — which already
      # exists and holds a **Postgres 16** datadir from the pre-MySQL, database-per-tenant
      # era. Postgres 17 cannot read it and would abort on start, reproducing exactly the
      # MySQL-8-datadir-under-MariaDB failure that cost a month of nobody noticing. The
      # old volume is left untouched rather than deleted, because that is irreversible.
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      # The image's own probe. `-U` is not optional: without it pg_isready runs as the
      # container's default user, finds no such role, and reports a perfectly healthy
      # server as down — which then stalls `depends_on: service_healthy` forever.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-assetmon}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  dbdata:
  uploads:
  caddy_data:
  caddy_config:
