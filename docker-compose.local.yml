# LOCAL TEST ONLY — do not use on the server.
# Run with:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# Exposes the API on localhost:4000 and keeps Caddy out (no public domain locally).
services:
  api:
    ports:
      - "4000:4000"
  caddy:
    profiles: ["never"]
  mysql:
    # 3307 on the host, deliberately not 3306: the standalone `assetmon-mysql` dev
    # container already holds 3306, and two servers fighting over one port is a
    # confusing way to lose an afternoon. Host tooling reaches THIS one on 3307;
    # the api container reaches it as `mysql:3306` over the compose network.
    ports:
      - "3307:3306"
  postgres:
    # Only present under `--profile legacy`, for reading migration source data.
    ports:
      - "5432:5432"
