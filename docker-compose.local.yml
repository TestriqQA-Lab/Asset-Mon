# LOCAL TEST ONLY — do not use on the server.
# Run with:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# Exposes the API on localhost:4000 and keeps Caddy out (no public domain locally).
services:
  api:
    ports:
      - "4000:4000"
  caddy:
    profiles: ["never"]
  db:
    # 5433 on the host, deliberately not 5432: `assetmon-source-postgres-1` — the
    # stopped container left over from the pre-MySQL era — is still mapped to 5432,
    # and two servers fighting over one port is a confusing way to lose an afternoon.
    # Host tooling reaches THIS one on 5433; the api container reaches it as `db:5432`
    # over the compose network.
    ports:
      - "5433:5432"
